<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title description">
  <title id="title">Four light, warm-neutral exterior palettes</title>
  <desc id="description">Compare Oatmeal, Linen, Pebble and Ivory. Each row shows conceptual brick, stone, trim, roof and oak door colors. Linen is the warmer beige option; Pebble is cooler. These are digital color directions, not selected products.</desc>
  <rect width="1200" height="1030" fill="#faf9f6"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#343a35">
    <text x="54" y="76" font-size="40" font-weight="600">Light + warm</text>
    <text x="54" y="113" font-size="21" fill="#666c65">Four exterior palettes</text>
    <g font-size="18" font-weight="600">
      <text x="276" y="160">Brick</text>
      <text x="456" y="160">Stone</text>
      <text x="636" y="160">Trim</text>
      <text x="816" y="160">Roof / metal</text>
      <text x="996" y="160">Oak</text>
    </g>
    <g transform="translate(0 185)">
      <text x="54" y="39" font-size="27" font-weight="600">1 Oatmeal</text>
      <text x="54" y="70" font-size="17" fill="#666c65">Soft, muted warmth</text>
      <rect x="276" width="156" height="112" rx="8" fill="#d3cfc8"/>
      <rect x="456" width="156" height="112" rx="8" fill="#d6d5d2"/>
      <rect x="636" width="156" height="112" rx="8" fill="#f5f2ea" stroke="#dedbd2"/>
      <rect x="816" width="156" height="112" rx="8" fill="#535654"/>
      <rect x="996" width="150" height="112" rx="8" fill="#b58f5e"/>
      <g font-size="15" fill="#666c65">
        <text x="276" y="139">#D3CFC8</text>
        <text x="456" y="139">#D6D5D2</text>
        <text x="636" y="139">#F5F2EA</text>
        <text x="816" y="139">#535654</text>
        <text x="996" y="139">#B58F5E</text>
      </g>
    </g>
    <path d="M54 352H1146" stroke="#e1dfd7"/>
    <g transform="translate(0 380)">
      <text x="54" y="39" font-size="27" font-weight="600">2 Linen</text>
      <text x="54" y="70" font-size="17" fill="#666c65">Light beige, not gold</text>
      <rect x="276" width="156" height="112" rx="8" fill="#d8cdbb"/>
      <rect x="456" width="156" height="112" rx="8" fill="#d5d0c5"/>
      <rect x="636" width="156" height="112" rx="8" fill="#f3eee4" stroke="#dedbd2"/>
      <rect x="816" width="156" height="112" rx="8" fill="#595953"/>
      <rect x="996" width="150" height="112" rx="8" fill="#b58f5e"/>
      <g font-size="15" fill="#666c65">
        <text x="276" y="139">#D8CDBB</text>
        <text x="456" y="139">#D5D0C5</text>
        <text x="636" y="139">#F3EEE4</text>
        <text x="816" y="139">#595953</text>
        <text x="996" y="139">#B58F5E</text>
      </g>
    </g>
    <path d="M54 547H1146" stroke="#e1dfd7"/>
    <g transform="translate(0 575)">
      <text x="54" y="39" font-size="27" font-weight="600">3 Pebble</text>
      <text x="54" y="70" font-size="17" fill="#666c65">Cooler, quiet greige</text>
      <rect x="276" width="156" height="112" rx="8" fill="#c9c8c0"/>
      <rect x="456" width="156" height="112" rx="8" fill="#ded8cc"/>
      <rect x="636" width="156" height="112" rx="8" fill="#f4f1e9" stroke="#dedbd2"/>
      <rect x="816" width="156" height="112" rx="8" fill="#555956"/>
      <rect x="996" width="150" height="112" rx="8" fill="#b58f5e"/>
      <g font-size="15" fill="#666c65">
        <text x="276" y="139">#C9C8C0</text>
        <text x="456" y="139">#DED8CC</text>
        <text x="636" y="139">#F4F1E9</text>
        <text x="816" y="139">#555956</text>
        <text x="996" y="139">#B58F5E</text>
      </g>
    </g>
    <path d="M54 742H1146" stroke="#e1dfd7"/>
    <g transform="translate(0 770)">
      <text x="54" y="39" font-size="27" font-weight="600">4 Ivory</text>
      <text x="54" y="70" font-size="17" fill="#666c65">Bright, gently creamy</text>
      <rect x="276" width="156" height="112" rx="8" fill="#e6dece"/>
      <rect x="456" width="156" height="112" rx="8" fill="#cbc3b4"/>
      <rect x="636" width="156" height="112" rx="8" fill="#f4f1e8" stroke="#dedbd2"/>
      <rect x="816" width="156" height="112" rx="8" fill="#696a62"/>
      <rect x="996" width="150" height="112" rx="8" fill="#b58f5e"/>
      <g font-size="15" fill="#666c65">
        <text x="276" y="139">#E6DECE</text>
        <text x="456" y="139">#CBC3B4</text>
        <text x="636" y="139">#F4F1E8</text>
        <text x="816" y="139">#696A62</text>
        <text x="996" y="139">#B58F5E</text>
      </g>
    </g>
    <text x="54" y="964" font-size="17" fill="#666c65">Concept colors only, not selected brick, stone, paint or roofing products.</text>
    <text x="54" y="991" font-size="17" fill="#666c65">Confirm physical samples together in sun and shade. House model unchanged.</text>
  </g>
</svg>
